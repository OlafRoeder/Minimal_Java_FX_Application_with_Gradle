plugins {
    id 'application'
    // Select JavaFX artifacts and native libraries for the current platform.
    id 'org.openjfx.javafxplugin' version '0.1.0'
}
group = 'de.olaf-roeder'
version = '0.1-DEVELOPER'
java {
    toolchain { languageVersion = JavaLanguageVersion.of(27) }
}
repositories { mavenCentral() }
application {
    mainModule = 'minimal.javafx.application'
    mainClass = 'application.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}
javafx {
    version = '27'
    modules = ['javafx.controls']
}
tasks.named('wrapper') {
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f'
}
// Require an installed JDK; do not generate vendor-specific download URLs.
tasks.named('updateDaemonJvm') {
    toolchainPlatforms = []
}
